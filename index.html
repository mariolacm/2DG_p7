<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Colors</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
        }
        body{
            background-color: var(--DARK);
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Inter', Arial, sans-serif;
        }

        :root{
            --LIMA: #c0ff03;
            --STORM: #8696A8;
            --VIOLET: #e4d2fc;
            --CHILLI: #EF432B;
            --DARK: #282625;
            --FOREST: #325444;
            --LIGHT: #EFEAE8;
            
        }
        .container{
            display:grid;
            height: 100vh;
            width: 100vw;
            grid-template-columns: 1fr 1fr 0.7fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
        }

        .container > div {
            display: grid;
            align-content: start;
            justify-items: start;
            padding: 1.2vw;
            overflow: hidden;
        }

        .container p {
            font-size: 0.8vw;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .container h1 {
            font-family: 'Syne', Arial, sans-serif;
            font-weight: 700;
            font-size: min(7vw, 16vh);  
            line-height: 0.9;
            text-transform: uppercase;
            margin-top: 0.8vw;
        }

        .rectangulo1{
            background-color: var(--LIMA);
            color: var(--FOREST);                 
            grid-area: 1/1/2/2;
        }
        .rectangulo2{
            background-color: var(--STORM);
            color: var(--LIGHT);                  
            grid-area: 2/1/2/2;
        }
        .rectangulo2 p{ color: var(--DARK); }     
        .rectangulo3{
            background-color: var(--VIOLET);
            color: var(--CHILLI);                
            grid-area: 3/1/3/2;
        }
        .rectangulo4{
            background-color: var(--CHILLI);
            color: var(--LIGHT);                  
            grid-area: 4/1/5/2;
        }
        .rectangulo4 p{ color: var(--DARK); }     
        .rectangulo5{
            background-color: var(--DARK);
            color: var(--LIGHT);                  
            grid-area: 1/2/2/3;
        }
        .rectangulo6{
            background-color: var(--FOREST);
            color: var(--LIGHT);                  
            grid-area: 1/3/5/4;
            grid-template-columns: 1fr auto;      
        }
        .rectangulo6 h1{
            writing-mode: vertical-rl;           
            font-size: min(9vw, 15vh);
        }
        .rectangulo7{
            background-color: var(--LIGHT);
            color: var(--DARK);                   
            grid-area: 2/2/5/3;
            align-content: space-between;   
                  
        }
        .rectangulo7 h1{ font-size: min(7.5vw, 14vh); }
        </style>
</head>
<body>
    <div class="container">
        <div class="rectangulo1">
            <p>#CCFF02</p>
            <h1>LIME</h1>
        </div>
        <div class="rectangulo2">
            <p>#8696A8</p>
            <h1>STORM</h1>
        </div>
        <div class="rectangulo3">
            <p>#e4d2fc</p>
            <h1>VIOLET</h1>
        </div>
        <div class="rectangulo4">
            <p>#EF432B</p>
            <h1>CHILLI</h1>
        </div>
        <div class="rectangulo5">
            <p>#282625</p>
            <h1>DARK</h1>
        </div>
        <div class="rectangulo6">
            <p>#325444</p>
            <h1>FOREST</h1>
        </div>
        <div class="rectangulo7">
            <p>#EFEAE8</p>
            <h1>LIGHT &amp; BRIGHT</h1>  <!-- CAMBIO 8: antes & -->
        </div>
    </div>  <!-- CAMBIO 9: faltaba cerrar el container -->

</body>
</html>
